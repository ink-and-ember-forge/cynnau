# On every merge to main: test, build a release APK, publish it at a stable link.
name: Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cynnau.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cynnau.apk \
            --title "Cynnau (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Open this page on your phone and tap cynnau.apk to install." \
            --target "${{ github.sha }}"
